name: mcse
description: "Minecraft Java Edition server manager."
publish_to: 'none'
version: 0.1.4+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  rust_lib_mcse:
    path: rust_builder
  mcse_bridge:
    path: packages/mcse_bridge
  provider: ^6.1.2
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
